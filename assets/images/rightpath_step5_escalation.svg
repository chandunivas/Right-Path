  <circle cx="98" cy="470" r="20" fill="#075985" stroke="#38bdf8" stroke-width="1.5" />
  <text x="98" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">14448</text>
  <text x="132" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">RBI Integrated Ombudsman (CMS)</text>
  <text x="132" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Unlawful bank charges, minimum balance fines &amp; card scams</text>
  <text x="132" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Reserve Bank of India • cms.rbi.org.in • Call 14448</text>

  <!-- Right Column: History Drawer & Query Audit Records -->
  <rect x="540" y="96" width="420" height="448" rx="12" fill="url(#cardGrad5)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow5)" />
  <text x="564" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">SAVED INCIDENTS &amp; AUDIT RECORD TRAIL</text>

  <!-- Record Item 1 -->
  <rect x="564" y="146" width="372" height="88" rx="8" fill="#07201a" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
  <rect x="578" y="158" width="138" height="20" rx="4" fill="#450a0a" />
  <text x="584" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">EXTORTION DEFENDED</text>
  <text x="922" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Oct 18, 11:34 AM</text>
  <text x="578" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Train Fine: TTE demanding ₹20,000 cash</text>
  <text x="578" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6ee7b7">Section 138 Railways Act • Saved: ₹19,250 • India</text>

  <!-- Record Item 2 -->
  <rect x="564" y="244" width="372" height="88" rx="8" fill="#07201a" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
  <rect x="578" y="256" width="138" height="20" rx="4" fill="#064e3b" />
  <text x="584" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">UNLAWFUL BANK CHARGE</text>
  <text x="922" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Oct 16, 04:12 PM</text>
  <text x="578" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">₹850 Minimum Balance Penalty Reversal</text>
  <text x="578" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6ee7b7">RBI Master Circular DBR.No.Leg.BC.21 • India</text>

  <!-- Record Item 3 -->
  <rect x="564" y="342" width="372" height="88" rx="8" fill="#07201a" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
  <rect x="578" y="354" width="128" height="20" rx="4" fill="#075985" />
  <text x="584" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">CONSUMER OVERCHARGE</text>
  <text x="922" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Oct 12, 02:40 PM</text>
  <text x="578" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Restaurant Mandatory Service Charge 10%</text>
  <text x="578" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6ee7b7">CCPA Guidelines &amp; Consumer Act Sec 2(47)</text>

  <!-- Export & Record Control -->
  <rect x="564" y="442" width="372" height="70" rx="8" fill="#03211a" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
  <text x="578" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">OFFLINE RECORD KEEPING &amp; EVIDENCE</text>
  <text x="578" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ecfdf5">• Records persist in client localStorage and can be reloaded instantly.</text>
  <text x="578" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ecfdf5">• Serves as formal timestamped evidence for police &amp; consumer court filing.</text>
</svg>
